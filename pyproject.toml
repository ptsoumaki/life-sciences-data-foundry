[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "life-sciences-data-foundry"
version = "0.2.0"
description = "Enterprise GxP-compliant multi-omics foundry & clinical normalization engine"
authors = [{ name = "Vivi Tsoumaki", email = "ptsoumaki@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10, <3.12"

dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=3.1.0",
    "great-expectations>=1.0.0",
    "mlflow>=2.10.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
# Phase 6: Agentic Lineage & MLOps (LangGraph state graph auditor + FastMCP server)
# Install with: pip install -e ".[agentic]"
agentic = [
    "langgraph>=0.0.20",
    "mcp>=0.1.0",
]

[tool.setuptools.packages.find]
# Look inside analytical-layer/ where the actual Python packages (with __init__.py) live.
# Note: directories with hyphens (analytical-layer, agentic-ai) are not valid Python package
# names and cannot be imported directly; only their underscore-named sub-packages are exposed.
where = ["analytical-layer"]
include = ["omop_cdm_v54*", "medallion*"]
exclude = ["tests*"]