# /.github/workflows/tf-lint.yml
name: "DataOps: Infrastructure & Pipeline CI/CD Gate"

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Force the runner execution environment to prioritize the Node.js 24 engine
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  infrastructure-validation:
    name: "Lint & Validate Infrastructure Blueprint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2

      # GxP Compliance: Resolve environment inputs with audit trail logging
      - name: Verify and Resolve Deployment Secrets
        run: |
          ENV_NAME="${{ secrets.ENVIRONMENT }}"
          REG_NAME="${{ secrets.AWS_REGION }}"
          
          if [ -z "$ENV_NAME" ]; then
            echo "::warning::ENVIRONMENT secret missing. Defaulting to 'dev' for static linting."
            ENV_NAME="dev"
          fi
          if [ -z "$REG_NAME" ]; then
            echo "::warning::AWS_REGION secret missing. Defaulting to 'eu-west-1' for static linting."
            REG_NAME="eu-west-1"
          fi
          
          echo "RESOLVED_ENV=$ENV_NAME" >> $GITHUB_ENV
          echo "RESOLVED_REG=$REG_NAME" >> $GITHUB_ENV

      - name: Populate Terraform & Pipeline Environment Variables
        run: |
          echo "TF_VAR_environment=$RESOLVED_ENV" >> $GITHUB_ENV
          echo "TF_VAR_aws_region=$RESOLVED_REG" >> $GITHUB_ENV
          echo "ENVIRONMENT=$RESOLVED_ENV" >> $GITHUB_ENV
          echo "AWS_REGION=$RESOLVED_REG" >> $GITHUB_ENV

      # Infrastructure Validation Tier (Terraform IaC)
      - name: Setup Terraform Binary
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.5.0

      - name: Initialize Terraform (Detached Backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Verify Terraform Formatting Standards
        run: terraform -chdir=terraform fmt -check

      - name: Validate Declarative HCL Syntax
        run: terraform -chdir=terraform validate

      # Pipeline Validation Tier (Nextflow DSL2)
      - name: Cache Nextflow Engine Binaries
        id: cache-nextflow
        uses: actions/cache@v4.2.0
        with:
          path: ~/.nextflow
          key: ${{ runner.os }}-nextflow-23.04.0
          restore-keys: |
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow
        run: |
          mkdir -p ~/.nextflow
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -v

      - name: Evaluate Nextflow Config Resolution
        run: nextflow config pipelines/main.nf -profile local_dev

      - name: Dry-Run Stub Execution Gate
        run: |
          mkdir -p mock_data
          touch mock_data/sample_1.fastq
          nextflow run pipelines/main.nf \
            -profile local_dev \
            -stub \
            --raw_input "mock_data/*.fastq" \
            --outdir "mock_data/out"

  python-quality-gate:
    name: "Static Analysis & Type Safety Gate (Ruff & Mypy)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2

      - name: Setup Python 3.11 Environment
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Ruff Linter Gate
        run: ruff check .

      - name: Execute Ruff Formatting Gate
        run: ruff format --check .

      - name: Execute Mypy Static Type Verification
        run: mypy --explicit-package-bases --ignore-missing-imports analytical-layer/omop_cdm_v54 analytical-layer/medallion governance tests

  pyspark-dataops-test-suite:
    name: "PySpark DataOps & Contract Quality Gate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2

      - name: Setup OpenJDK 17 (PySpark JVM Runtime)
        uses: actions/setup-java@v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Python 3.11 Environment
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Platform & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute PySpark Unit & Integration Test Suite
        run: |
          pytest --cov=analytical-layer --cov=governance --cov-report=term-missing --cov-report=xml tests/

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4.6.1
        if: always()
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 14