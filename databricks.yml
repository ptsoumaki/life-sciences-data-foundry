# ==============================================================================
# DATABRICKS ASSET BUNDLE (DABs) ARCHITECTURE SPECIFICATION
# ==============================================================================
# Enterprise DataOps & CI/CD deployment configuration for Life Sciences Data Foundry.
# Managed via Databricks CLI: `databricks bundle deploy` & `databricks bundle run`
# ==============================================================================

bundle:
  name: life-sciences-data-foundry

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.databricks_host}
      root_path: /Workspace/Projects/life-sciences-data-foundry

  staging:
    mode: production
    workspace:
      host: ${var.databricks_host}
      root_path: /Workspace/Projects/life-sciences-data-foundry

  prod:
    mode: production
    workspace:
      host: ${var.databricks_host}
      root_path: /Workspace/Projects/life-sciences-data-foundry

variables:
  databricks_host:
    description: Databricks Workspace URL. Override via --var or BUNDLE_VAR_databricks_host env var.
    default: ""
