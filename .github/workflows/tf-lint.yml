name: "DataOps: Infrastructure CI/CD Gate"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Force the runner execution environment to prioritize the Node.js 24 engine
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  terraform-spec-validation:
    name: "Lint & Validate Structural Architecture"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.ENVIRONMENT }}" ]; then echo "Missing ENVIRONMENT secret" >&2; exit 1; fi
          if [ -z "${{ secrets.AWS_REGION }}" ]; then echo "Missing AWS_REGION secret" >&2; exit 1; fi

      - name: Load environment vars into workflow
        run: |
          echo "TF_VAR_environment=${{ secrets.ENVIRONMENT }}" >> $GITHUB_ENV
          echo "TF_VAR_aws_region=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ secrets.ENVIRONMENT }}" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV

      - name: Setup Terraform Binary
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Initialize Configuration Environments
        run: terraform -chdir=terraform init -backend=false

      - name: Static Layout Compliance Check
        run: terraform -chdir=terraform fmt -check

      - name: Declarative Syntax Evaluation
        run: terraform -chdir=terraform validate

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Nextflow validation
        run: |
          nextflow -v
          nextflow info pipelines/main.nf || true