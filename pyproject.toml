[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "life-sciences-data-foundry"
version = "0.2.9"
description = "Enterprise GxP-compliant multi-omics foundry & clinical normalization engine"
authors = [{ name = "Vivi Tsoumaki", email = "ptsoumaki@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10, <3.13"

dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=3.1.0",
    "great-expectations>=1.0.0",
    "mlflow>=2.10.0",
    "pydantic>=2.6.0",
    "langgraph>=0.0.20",
    "mcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
# Look inside analytical-layer/ where the actual Python packages (with __init__.py) live.
# Note: directories with hyphens (analytical-layer, agentic-ai) are not valid Python package
# names and cannot be imported directly; only their underscore-named sub-packages are exposed.
where = ["analytical-layer", "."]
include = ["omop_cdm_v54*", "medallion*", "governance*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # Line length handled by formatter
    "B008",   # Do not perform function calls in argument defaults
    "RUF012", # Mutable class attributes should be annotated with typing.ClassVar
]

[tool.ruff.lint.isort]
known-first-party = ["omop_cdm_v54", "governance", "medallion"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
mypy_path = ["analytical-layer", "."]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "network: marks tests requiring live GitHub/S3 network access (opt-in via LSDF_NETWORK_TESTS=1)",
]

[tool.coverage.run]
source = ["omop_cdm_v54", "governance", "medallion", "agentic-ai"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]